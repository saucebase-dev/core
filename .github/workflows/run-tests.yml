name: Tests

on:
    # No `branches:` filter: that key matches the PR's *base* branch, so an allowlist
    # skips CI for any epic branch not named here, showing as no checks rather than a
    # failure.
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  phplint:
      permissions:
          contents: write
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v6
            with:
                ref: ${{ github.head_ref }}
          - name: "laravel-pint"
            uses: aglipanci/laravel-pint-action@latest
            with:
                configPath: './pint.json'

          - name: Commit changes
            uses: stefanzweifel/git-auto-commit-action@v7
            with:
                commit_message: PHP Linting (Pint)
