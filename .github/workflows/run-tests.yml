name: Tests

on:
    # No `branches:` filter: that key matches the PR's *base* branch, so an allowlist
    # skips CI for any epic branch not named here, showing as no checks rather than a
    # failure.
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Vitest

    defaults:
      run:
        working-directory: resources/js

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: resources/js/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Execute tests
        run: npm test

  fresh-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        framework: [vue, react]

    name: Fresh app (${{ matrix.framework }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: core

      # A new Laravel application with this checkout installed into it, as the README says.
      - name: Create the application
        uses: ./core/.github/actions/fresh-app
        with:
          framework: ${{ matrix.framework }}
          core-path: core

      - name: Execute the application's tests
        working-directory: app
        run: php artisan test

      # Core's own browser tests. They are not published: an application owns its pages.
      - name: Add core's browser tests
        run: |
          cp -R core/tests/e2e app/tests/e2e/core
          mv app/tests/e2e/core/Support/*.php app/tests/Support/

      - name: Install Playwright
        working-directory: app
        # Takes ~25s; a hung apt mirror would otherwise run until the job's limit.
        timeout-minutes: 2
        run: ./node_modules/.bin/playwright install chromium --with-deps

      # Playwright serves .env.e2e itself (laravelServer() in playwright.config.ts).
      - name: Prepare the E2E environment
        working-directory: app
        run: php artisan playwright:env --url=http://localhost:8000 --force

      - name: Execute core's browser tests
        working-directory: app
        run: ./node_modules/.bin/playwright test tests/e2e/core

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.framework }}
          path: app/playwright-report/

      # What a customer does next: a module of their own, from the recipe core ships.
      - name: Create a module from the recipe
        working-directory: app
        run: |
          php artisan saucebase:recipe Notes basic --no-interaction
          composer require "modules/notes:*" --no-interaction --no-progress
          npm run build
          php artisan test

  phplint:
      permissions:
          contents: write
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v7
            with:
                ref: ${{ github.head_ref }}
          - name: "laravel-pint"
            uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
            with:
                configPath: './pint.json'

          - name: Commit changes
            uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
            with:
                commit_message: PHP Linting (Pint)
