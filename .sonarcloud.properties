# Test files are tests, not product code: they are not measured for duplication.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/*.test.ts,**/*.test.tsx

# shadcn components are generated by its CLI and never edited by hand, so their findings
# are not ours to fix. `saucebase/` and `sonner/` hold our own components and stay
# analysed; a newly added shadcn-vue component needs its folder listed here.
#
# A recipe is a template: its class and file names are placeholders the command fills in.
sonar.exclusions=stubs/recipes/**,stubs/stack/react/js/components/ui/*.tsx,stubs/stack/vue/js/components/ui/alert/**,stubs/stack/vue/js/components/ui/alert-dialog/**,stubs/stack/vue/js/components/ui/avatar/**,stubs/stack/vue/js/components/ui/badge/**,stubs/stack/vue/js/components/ui/breadcrumb/**,stubs/stack/vue/js/components/ui/button/**,stubs/stack/vue/js/components/ui/button-group/**,stubs/stack/vue/js/components/ui/card/**,stubs/stack/vue/js/components/ui/checkbox/**,stubs/stack/vue/js/components/ui/collapsible/**,stubs/stack/vue/js/components/ui/dialog/**,stubs/stack/vue/js/components/ui/dropdown-menu/**,stubs/stack/vue/js/components/ui/field/**,stubs/stack/vue/js/components/ui/input/**,stubs/stack/vue/js/components/ui/input-group/**,stubs/stack/vue/js/components/ui/label/**,stubs/stack/vue/js/components/ui/number-field/**,stubs/stack/vue/js/components/ui/popover/**,stubs/stack/vue/js/components/ui/scroll-area/**,stubs/stack/vue/js/components/ui/separator/**,stubs/stack/vue/js/components/ui/sheet/**,stubs/stack/vue/js/components/ui/sidebar/**,stubs/stack/vue/js/components/ui/skeleton/**,stubs/stack/vue/js/components/ui/slider/**,stubs/stack/vue/js/components/ui/textarea/**,stubs/stack/vue/js/components/ui/tooltip/**
